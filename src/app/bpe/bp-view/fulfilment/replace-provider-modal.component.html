<!-- HCDP-05-04 F2 — Replace Provider modal (inline backdrop pattern from HCDP-04-02 watchlist) -->
<div *ngIf="open" class="modal-backdrop-inline">
    <div class="modal d-block" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fa fa-exchange-alt mr-2"></i>
                        <span [innerHTML]="'Replace Logistics Provider' | translate"></span>
                    </h5>
                    <button type="button" class="close" [disabled]="submitting" (click)="onCancel()">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Current provider (read-only) -->
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">
                            <span [innerHTML]="'Current provider' | translate"></span>
                        </label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control"
                                   [value]="currentProviderName || ''" disabled>
                        </div>
                    </div>
                    <!-- New provider (dropdown) -->
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">
                            <span [innerHTML]="'New provider' | translate"></span>
                            <span class="text-danger">*</span>
                        </label>
                        <div class="col-sm-8">
                            <select class="form-control" [(ngModel)]="selectedSlug"
                                    [disabled]="submitting || hasLoadError()">
                                <option [ngValue]="null">{{ 'Select a provider' | translate }}</option>
                                <option *ngFor="let p of availableProviders()" [ngValue]="p.slug">
                                    {{ p.name }} <small *ngIf="p.country">({{ p.country }})</small>
                                </option>
                            </select>
                            <div *ngIf="hasLoadError()" class="alert alert-danger small mt-2 mb-0">
                                <i class="fa fa-exclamation-triangle mr-1"></i>
                                <span [innerHTML]="'Logistics directory unavailable. Please try again later.' | translate"></span>
                            </div>
                        </div>
                    </div>
                    <!-- Reason (optional) -->
                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">
                            <span [innerHTML]="'Reason (optional)' | translate"></span>
                        </label>
                        <div class="col-sm-8">
                            <textarea class="form-control" rows="3" maxlength="500"
                                      [(ngModel)]="reason" [disabled]="submitting"
                                      placeholder="{{ 'e.g., Original carrier delayed; switching to faster option' | translate }}"></textarea>
                        </div>
                    </div>
                    <!-- Cancellation window indicator -->
                    <div class="alert alert-info small mb-0">
                        <i class="fa fa-info-circle mr-1"></i>
                        {{ 'Replacement allowed within' | translate }}
                        {{ cancellationWindowDays }}
                        {{ 'days of dispatch.' | translate }}
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary"
                            [disabled]="submitting" (click)="onCancel()">
                        <span [innerHTML]="'Cancel' | translate"></span>
                    </button>
                    <button type="button" class="btn btn-warning"
                            [disabled]="!canConfirm()" (click)="onConfirm()">
                        <i class="fa" [ngClass]="submitting ? 'fa-spinner fa-spin' : 'fa-check'"></i>
                        <span class="ml-1" [innerHTML]="'Confirm Replacement' | translate"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
