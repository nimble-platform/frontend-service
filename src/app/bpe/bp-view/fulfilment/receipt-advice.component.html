<ng-container *ngIf="receiptAdvice">

    <div class="row title-row">
        <div class="col-6">
            <h4><span [innerHTML]="'Dispatch Advice' | translate"></span></h4>
        </div>
        <div class="col-6">
            <h4><span [innerHTML]="'Receipt Advice' | translate"></span></h4>
        </div>
    </div>

    <div class="content-row bg-light">
        <div class="row">
            <div class="col-12">
                <h5><span>Dispatched &amp; Received Quantities</span></h5>
            </div>
        </div>
        <!-- HCDP-05-02 F1+F2 — per-line layout: Item | Delivered | Accepted | Rejected | Issue Category + Reject Reason -->
        <div *ngFor="let dispatchAdviceLine of dispatchAdvice.despatchLine; let i=index" class="receipt-line border-bottom pb-2 mb-2">
            <div class="row">
                <div class="col-3">
                    <strong>{{dispatchAdviceLine.item.name[0].value}}</strong>
                </div>
                <div class="col-3">
                    <small class="text-muted">{{'Delivered' | translate}}:</small>
                    {{quantityToString(dispatchAdviceLine.deliveredQuantity)}}
                </div>
                <div class="col-3">
                    <!-- HCDP-05-02 F2 — Accepted Quantity (UI helper; rejected derived) -->
                    <quantity-input [disabled]="isLoading() || isReadOnly()" [disableQuantityUnit]="true"
                        label="Accepted" [quantity]="acceptedQuantities[i]"
                        (onQuantityValueChange)="onAcceptedChange(i)">
                    </quantity-input>
                </div>
                <div class="col-3">
                    <!-- Rejected Quantity (canonical UBL field) -->
                    <quantity-input [disabled]="isLoading() || isReadOnly()" [disableQuantityUnit]="true"
                        label="Rejected" [quantity]="receiptAdvice.receiptLine[i].rejectedQuantity"
                        (onQuantityValueChange)="onRejectedChange(i)">
                    </quantity-input>
                </div>
            </div>
            <!-- HCDP-05-02 F1 — per-line Issue Category + Reject Reason (rendered only when something rejected, to keep clean rows) -->
            <div class="row mt-1" *ngIf="(receiptAdvice.receiptLine[i].rejectedQuantity?.value || 0) > 0 || selectedReasonCodes[i]">
                <div class="col-4">
                    <label class="form-label mb-1"><small class="text-muted">{{'Issue Category' | translate}}</small></label>
                    <select class="form-control form-control-sm"
                        [(ngModel)]="selectedReasonCodes[i]"
                        (change)="onReasonCodeChange(i)"
                        [disabled]="isLoading() || isReadOnly()">
                        <option value="">{{'Select issue category...' | translate}}</option>
                        <option value="DAMAGED">{{'Damaged on arrival' | translate}}</option>
                        <option value="QUANTITY_MISMATCH">{{'Quantity mismatch' | translate}}</option>
                        <option value="LATE">{{'Late delivery' | translate}}</option>
                        <option value="QUALITY_ISSUE">{{'Quality issue' | translate}}</option>
                        <option value="OTHER">{{'Other' | translate}}</option>
                    </select>
                </div>
                <div class="col-8">
                    <text-input label="Reject Reason" [disabled]="isLoading() || isReadOnly()"
                        [(text)]="receiptAdvice.receiptLine[i].rejectReason[0]" rows="2">
                    </text-input>
                </div>
            </div>
        </div>
    </div>

    <div class="row content-row" *ngIf="hasShipmentToShow()">
        <div class="col-12">
            <!-- Shipment (guarded — original component crashes on null carrierParty/partyName) -->
            <shipment-input [shipment]="dispatchAdvice.despatchLine[0].shipment[0]" presentationMode="view">
            </shipment-input>
        </div>
    </div>

    <!-- HCDP-05-02 F4 — Categorized supporting documents (Invoice / Delivery Note / Quality Cert / General) -->
    <h5><span [innerHTML]="'Notes and Additional Files' | translate"></span></h5>
    <div class="row content-row bg-light">
        <div class="col-6">
            <note-file-view [notes]="dispatchAdvice.note" [documents]="dispatchAdvice.additionalDocumentReference"
                [firstCol]="'col-4'" [lastCol]="'col-8'" [label]="'Supplier Note'|translate"></note-file-view>
        </div>
        <div class="col-6">
            <note-file-view [notes]="receiptAdvice.note" [documents]="receiptAdvice.additionalDocumentReference"
                [firstCol]="'col-4'" [lastCol]="'col-8'" [readonly]="isLoading() || isReadOnly()"
                [label]="'Customer note'|translate"></note-file-view>
            <hr class="my-2">
            <!-- F4: 3 typed buckets + 1 General fallback for legacy untyped uploads -->
            <note-file-view [notes]="[]" [documents]="receiptAdvice.additionalDocumentReference"
                [documentType]="'INVOICE'"
                [firstCol]="'col-4'" [lastCol]="'col-8'" [readonly]="isLoading() || isReadOnly()"
                [label]="'Invoice'|translate"></note-file-view>
            <note-file-view [notes]="[]" [documents]="receiptAdvice.additionalDocumentReference"
                [documentType]="'DELIVERY_NOTE'"
                [firstCol]="'col-4'" [lastCol]="'col-8'" [readonly]="isLoading() || isReadOnly()"
                [label]="'Delivery Note'|translate"></note-file-view>
            <note-file-view [notes]="[]" [documents]="receiptAdvice.additionalDocumentReference"
                [documentType]="'QUALITY_CERT'"
                [firstCol]="'col-4'" [lastCol]="'col-8'" [readonly]="isLoading() || isReadOnly()"
                [label]="'Quality Certificate'|translate"></note-file-view>
        </div>
    </div>

    <hr class="actions-hr">

    <!-- Actions -->
    <div class="d-flex justify-content-end actions-row" *ngIf="userRole === 'buyer'">
        <div class="col-8 call-status-col">
            <call-status [callStatus]="callStatus"></call-status>
        </div>
        <div class="col-2">
            <button class="btn btn-secondary action" [disabled]="isLoading()" (click)="onBack()"><span [innerHTML]="'Back' | translate"></span></button>
        </div>
        <div *ngIf="!isReadOnly()" class="col-2">
            <button class="btn btn-primary action" [disabled]="isLoading() || isReadOnly() || isThereADeletedProduct()" (click)="onSendReceiptAdvice()" singleClick>
                <span [innerHTML]="'Send Advice' | translate"></span>
            </button>
        </div>
    </div>

    <div class="row actions-row" *ngIf="userRole === 'seller'">
        <div class="col-7 call-status-col">
            <call-status [callStatus]="callStatus"></call-status>
        </div>
        <div class="col-2">
            <button class="btn btn-secondary action" [disabled]="isLoading()" (click)="onBack()"><span [innerHTML]="'Back' | translate"></span></button>
        </div>
        <div class="col-3">
            <button class="btn btn-secondary action" [disabled]="isDispatchOrderDisabled()" (click)="onDispatchOrder()">
                <span [innerHTML]="'Dispatch Order' | translate"></span>
            </button>
        </div>
    </div>
</ng-container>
