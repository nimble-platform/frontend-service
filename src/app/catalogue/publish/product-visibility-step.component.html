<div class="col-12 col-md-8">
    <h5><span [innerHTML]="'Visibility' | translate"></span></h5>
    <p class="text-muted">
        <span [innerHTML]="'Set who can discover the products in this catalogue.' | translate"></span>
    </p>

    <!-- Visibility mode radio buttons -->
    <div class="form-group">
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="visibilityMode"
                   id="visPublic" value="public"
                   [(ngModel)]="visibilityMode"
                   (ngModelChange)="onVisibilityModeChange()"
                   [disabled]="disabled">
            <label class="form-check-label" for="visPublic">
                <strong><span [innerHTML]="'Public' | translate"></span></strong>
                &mdash; <span [innerHTML]="'Visible to all companies on the platform' | translate"></span>
            </label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="visibilityMode"
                   id="visWhitelist" value="whitelist"
                   [(ngModel)]="visibilityMode"
                   (ngModelChange)="onVisibilityModeChange()"
                   [disabled]="disabled">
            <label class="form-check-label" for="visWhitelist">
                <strong><span [innerHTML]="'Whitelist Only' | translate"></span></strong>
                &mdash; <span [innerHTML]="'Only selected companies can see this catalogue' | translate"></span>
            </label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="visibilityMode"
                   id="visBlacklist" value="blacklist"
                   [(ngModel)]="visibilityMode"
                   (ngModelChange)="onVisibilityModeChange()"
                   [disabled]="disabled">
            <label class="form-check-label" for="visBlacklist">
                <strong><span [innerHTML]="'Blacklist' | translate"></span></strong>
                &mdash; <span [innerHTML]="'Hidden from selected companies' | translate"></span>
            </label>
        </div>
    </div>

    <!-- Company search panel — shown when whitelist or blacklist is selected -->
    <div *ngIf="visibilityMode !== 'public'" class="mt-3">

        <label>
            <span *ngIf="visibilityMode === 'whitelist'" [innerHTML]="'Add companies to whitelist:' | translate"></span>
            <span *ngIf="visibilityMode === 'blacklist'" [innerHTML]="'Add companies to blacklist:' | translate"></span>
        </label>

        <!-- Search input -->
        <div class="input-group mb-2">
            <input type="text" class="form-control"
                   [(ngModel)]="searchQuery"
                   (ngModelChange)="onSearchInput($event)"
                   [placeholder]="'Search company name...' | translate"
                   [disabled]="disabled">
            <div class="input-group-append">
                <span class="input-group-text"><i class="fa fa-search"></i></span>
            </div>
        </div>

        <!-- Search status -->
        <div *ngIf="searchCallStatus.isLoading()" class="text-muted small mb-2">
            <i class="fa fa-spinner fa-spin"></i>
            <span [innerHTML]="'Searching...' | translate"></span>
        </div>
        <div *ngIf="searchCallStatus.isError()" class="text-danger small mb-2">
            <span [innerHTML]="'Search failed. Please try again.' | translate"></span>
        </div>

        <!-- Search results dropdown -->
        <div *ngIf="searchResults.length > 0" class="list-group mb-3" style="max-height:200px;overflow-y:auto;">
            <div *ngFor="let company of searchResults"
                 class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2">
                <span>{{ company.legalName }}</span>
                <button type="button" class="btn btn-sm btn-outline-primary"
                        (click)="addCompany(company)"
                        [disabled]="disabled || isAlreadyAdded(company.vatNumber || company.id)">
                    <span *ngIf="!isAlreadyAdded(company.vatNumber || company.id)" [innerHTML]="'Add' | translate"></span>
                    <span *ngIf="isAlreadyAdded(company.vatNumber || company.id)" [innerHTML]="'Added' | translate"></span>
                </button>
            </div>
        </div>

        <!-- Selected companies — Whitelist -->
        <div *ngIf="visibilityMode === 'whitelist'">
            <label><span [innerHTML]="'Whitelisted companies:' | translate"></span></label>
            <div *ngIf="whiteListCompanies.length === 0" class="text-muted small">
                <span [innerHTML]="'No companies added yet. All companies will be able to see this catalogue.' | translate"></span>
            </div>
            <div class="d-flex flex-wrap">
                <span *ngFor="let company of whiteListCompanies; let i = index"
                      class="badge badge-primary mr-1 mb-1 p-2" style="font-size:0.85em;">
                    {{ company.legalName }}
                    <i *ngIf="!disabled" class="fa fa-times ml-1"
                       style="cursor:pointer;" (click)="removeCompany('whitelist', i)"></i>
                </span>
            </div>
        </div>

        <!-- Selected companies — Blacklist -->
        <div *ngIf="visibilityMode === 'blacklist'">
            <label><span [innerHTML]="'Blacklisted companies:' | translate"></span></label>
            <div *ngIf="blackListCompanies.length === 0" class="text-muted small">
                <span [innerHTML]="'No companies added yet. All companies will be able to see this catalogue.' | translate"></span>
            </div>
            <div class="d-flex flex-wrap">
                <span *ngFor="let company of blackListCompanies; let i = index"
                      class="badge badge-danger mr-1 mb-1 p-2" style="font-size:0.85em;">
                    {{ company.legalName }}
                    <i *ngIf="!disabled" class="fa fa-times ml-1"
                       style="cursor:pointer;" (click)="removeCompany('blacklist', i)"></i>
                </span>
            </div>
        </div>
    </div>
</div>
